<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão HELP-TECH V3</title><style>
:root{font-family:Arial,sans-serif;color:#eaf2ff;background:#071b37}body{margin:0}header{padding:22px 16px;background:linear-gradient(120deg,#0b2953,#175a9c)}h1{font-size:21px;margin:0}small{color:#c3d4ed}main{padding:12px;max-width:800px;margin:auto}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}button{background:#1885c0;color:white;border:0;border-radius:9px;padding:12px;font-size:15px}nav button{background:#153d6a}.panel{background:#102e53;padding:14px;border-radius:12px;margin:10px 0;border:1px solid #315b89}label{display:block;margin:10px 0 3px}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #6686a7;border-radius:8px;padding:11px;background:#fff;color:#111;font-size:16px}.hide{display:none!important}.item{border-bottom:1px solid #375d83;padding:12px 0}.danger{background:#a33136}.muted{color:#a8c2e4}.ok{color:#80e0b2}#message{white-space:pre-wrap}.line{display:flex;justify-content:space-between;gap:8px;align-items:center}.line button{width:auto}#login{max-width:450px;margin:25px auto}h2{font-size:18px}
/* Painel visual aprovado: hotspots acompanham a arte em qualquer largura */
#dashboard{width:min(100vw,calc(100dvh * 941 / 1672));height:min(100dvh,calc(100vw * 1672 / 941));max-width:none;margin:0 auto;position:relative;overflow:hidden;background:#06172d url('painel_helptech_v3.png') center top / 100% 100% no-repeat;box-shadow:0 0 30px #0089e844}
#dashboard .hotspot{position:absolute;border:0;background:transparent;border-radius:13%;cursor:pointer;color:transparent;font-size:0;padding:0;touch-action:manipulation}
#dashboard .hotspot:focus-visible{outline:3px solid #fff;outline-offset:-5px}
#dashboard .hotspot:active{background:#ffffff33}
#dashboard .h-agenda{left:4%;top:31.7%;width:42%;height:14.2%}
#dashboard .h-caixa{left:55%;top:31.7%;width:42%;height:14.2%}
#dashboard .h-lucro{left:4%;top:48.4%;width:42%;height:14.2%}
#dashboard .h-clientes{left:55%;top:48.4%;width:42%;height:14.2%}
#dashboard .h-config{left:4%;top:64.7%;width:42%;height:13.2%}
#dashboard .h-sync{left:55%;top:64.7%;width:42%;height:13.2%}
#dashboard .h-status{left:4%;top:91.5%;width:92%;height:7%}
#dashboard .live-status{position:absolute;left:5%;right:5%;bottom:1.7%;height:5.9%;display:flex;flex-direction:column;justify-content:center;gap:2px;background:#051a36f5;border-radius:9px;text-align:center;color:#fff;font-size:clamp(9px,2.2vw,13px);pointer-events:none}#dashboard .live-clock{position:absolute;left:4%;top:.15%;padding:2px 7px;border-radius:6px;background:#031027;color:white;font-size:clamp(11px,3vw,17px);text-shadow:0 1px 4px #000}#dashboard .live-status .sub{font-size:.85em;color:#b9d7ee}
#dashboard .live-status.warn{color:#ffdba1}
#dashboard .home-exit{position:absolute;right:2%;top:2.4%;background:#06172ddd;border:1px solid #5abaff;color:white;border-radius:20px;padding:6px 9px;font-size:12px}
#moduleScreen{max-width:800px;margin:auto}
#moduleScreen header{display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:2;padding:12px}
#moduleScreen header button{background:#07294f;border:1px solid #5db7ed;padding:8px}
#moduleScreen nav{padding:0 12px}
#moduleScreen main{padding-top:0}
#loginWrap{min-height:100dvh;background:linear-gradient(#00182bc9,#00182bea),url('painel_helptech_v3.png') center/cover;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#loginWrap .panel{width:100%;max-width:370px;box-sizing:border-box;text-align:left;box-shadow:0 0 35px #0bbcff55}
#loginWrap .brand{display:block;margin:0 auto 10px;width:112px;height:112px;object-fit:contain;border-radius:50%;background:#fff;padding:8px}
#loginWrap h2{text-align:center}
#loginWrap button{width:100%}
body{background:#04152c}body:has(#dashboard:not(.hide)){overflow:hidden}#dashboard .home-exit{top:3.1%}
</style><div id="loginWrap"><div style="width:100%"><h1>✡ GESTÃO HELP-TECH</h1><small>V3 Beta • Independente e sincronizável</small></header><main>
<section id="login" class="panel"><img class="brand" src="logo_original.png" alt="Logomarca original HELP-TECH"><h2 id="loginTitle">Acesso</h2><label>Usuário<input id="user" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton">Continuar</button><p id="loginMessage" class="muted"></p></section></div></div>
<section id="dashboard" class="hide" aria-label="Painel inicial HELP-TECH"><button class="home-exit" id="logout" aria-label="Sair">Sair</button><button class="hotspot h-agenda" data-open="appointments" aria-label="Agendamentos">Agendamentos</button><button class="hotspot h-caixa" data-open="cash_entries" aria-label="Fluxo de Caixa">Fluxo de Caixa</button><button class="hotspot h-lucro" data-open="service_profits" aria-label="Lucro por Serviço">Lucro por Serviço</button><button class="hotspot h-clientes" data-open="clients" aria-label="Clientes">Clientes</button><button class="hotspot h-config" data-open="settings" aria-label="Configurações">Configurações</button><button class="hotspot h-sync" data-open="sync" aria-label="Sincronização">Sincronização</button><button class="hotspot h-status" data-open="settings" aria-label="Status de operações">Status de operações</button><div class="live-clock" id="liveClock" aria-label="Data e hora do aparelho"></div><div class="live-status" id="dashStatus" aria-live="polite">Carregando dados locais...</div></section>
<div id="moduleScreen" class="hide"><header><button id="goHome">← Início</button><b>GESTÃO HELP-TECH V3</b></header><main><section id="workspace"><nav><button data-page="appointments">Agenda</button><button data-page="cash_entries">Fluxo de caixa</button><button data-page="service_profits">Lucro por serviço</button><button data-page="settings">Operações / Rede</button></nav><section class="panel"><h2 id="pageTitle"></h2><div id="formArea"></div><div id="records"></div></section><p id="message" class="muted"></p></section></main></div><script>
'use strict';const $=id=>document.getElementById(id);const STORAGE='helptech_v3_beta_data';let state={appointments:[],cash_entries:[],service_profits:[],queue:[],settings:{url:'',key:''},lastSync:'Nunca',user:null},page='appointments';
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}function load(){try{let a=JSON.parse(localStorage.getItem(STORAGE));if(a&&typeof a==='object')state={...state,...a}}catch(e){}}function id(){return 'v3-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){$('message').textContent=s}function fields(){return {appointments:[['client','Cliente','text'],['appt_date','Data','date'],['appt_time','Hora','time'],['address','Endereço','text'],['service','Serviço','text'],['priority','Prioridade','select'],['observations','Observações','text']],cash_entries:[['entry_date','Data','date'],['kind','Tipo','select'],['description','Descrição','text'],['amount','Valor (R$)','number']],service_profits:[['service_date','Data','date'],['client','Cliente','text'],['description','Serviço','text'],['service_value','Valor do serviço','number'],['material_value','Materiais','number'],['expenses','Despesas','number']]}}function title(t){return {appointments:'Agendamentos',cash_entries:'Fluxo de caixa',service_profits:'Lucro por serviço',settings:'Status de operações e rede'}[t]}
async function digest(s){let b=new TextEncoder().encode(s),hash=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('')}
$('loginButton').onclick=async()=>{let u=$('user').value.trim(),p=$('password').value;if(!u||p.length<6){$('loginMessage').textContent='Informe usuário e senha com pelo menos 6 caracteres.';return}if(!state.user){state.user={name:u,hash:await digest(u+':'+p)};save()}else if(state.user.name!==u||state.user.hash!==await digest(u+':'+p)){$('loginMessage').textContent='Usuário ou senha incorretos.';return}$('loginWrap').classList.add('hide');$('dashboard').classList.remove('hide');$('moduleScreen').classList.add('hide');updateDashboard()};
function show(t){if(t==='clients'){alert('Cadastro de clientes: módulo em desenvolvimento nesta versão Beta.');return}if(t==='sync')t='settings';$('dashboard').classList.add('hide');$('moduleScreen').classList.remove('hide');page=t;$('pageTitle').textContent=title(t);if(t==='settings'){renderSettings();return}let html='<form id="recordForm">';for(let [name,label,type] of fields()[t]){html+='<label>'+label+'</label>';if(type==='select'){let opts=name==='priority'?['Média','Baixa','Alta','Urgente']:['Entrada','Saída'];html+='<select name="'+name+'">'+opts.map(o=>'<option>'+o+'</option>').join('')+'</select>'}else html+='<input name="'+name+'" type="'+type+'" '+(type==='number'?'step="0.01" min="0"':'')+'>'}html+='<button type="submit">Salvar no celular</button></form>';$('formArea').innerHTML=html;let form=$('recordForm');for(let f of form.elements)if(f.type==='date')f.value=new Date().toISOString().slice(0,10);form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form).entries());if(t==='appointments'&&(!d.client||!d.appt_date||!d.appt_time)){msg('Preencha cliente, data e hora.');return}if(t!=='appointments'&&!d.description){msg('Preencha a descrição.');return}if(t==='cash_entries'&&(!d.amount||Number(d.amount)<0)){msg('Informe valor válido.');return}if(t==='service_profits'){for(let k of ['service_value','material_value','expenses'])d[k]=Number(d[k]||0);d.profit=d.service_value-d.material_value-d.expenses}if(t==='cash_entries')d.amount=Number(d.amount);d.id='local-'+id();d._uid=id();state[t].push(d);state.queue.push({uid:d._uid,entity:t,operation:'create',data:d,localId:d.id});save();updateDashboard();show(t);msg('Salvo offline. Aguardando sincronização.');};renderRecords()}
function renderRecords(){let t=page,rows=state[t]||[];$('records').innerHTML='<h2>Registros ('+rows.length+')</h2>'+rows.map(a=>'<div class="item"><div class="line"><b>'+esc(a.client||a.description||'Registro')+'</b><button class="danger" data-delete="'+esc(a.id)+'">Excluir</button></div><small>'+esc(a.appt_date||a.entry_date||a.service_date||'')+' '+esc(a.appt_time||'')+' • '+esc(a.kind||a.priority||'')+'</small><div>'+esc(a.service||a.description||'')+'</div>'+(t==='cash_entries'?'<b>R$ '+Number(a.amount||0).toFixed(2)+'</b>':t==='service_profits'?'<b>Lucro: R$ '+Number(a.profit||0).toFixed(2)+'</b>':'')+'</div>').join('');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let rec=state[t].find(x=>String(x.id)===b.dataset.delete);if(!rec||!confirm('Excluir definitivamente este registro? Não será possível desfazer.'))return;state[t]=state[t].filter(x=>x!==rec);let pending=state.queue.find(q=>q.entity===t&&q.operation==='create'&&q.localId===rec.id);if(pending){state.queue=state.queue.filter(q=>q!==pending)}else{state.queue.push({uid:id(),entity:t,operation:'delete',record_id:rec.id})}save();updateDashboard();renderRecords();msg('Exclusão registrada; sincronização pendente, se necessário.')})}
function updateClock(){let e=$('liveClock');if(e)e.textContent=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}function updateDashboard(){let s=$('dashStatus');if(!s)return;let n=state.queue.length;let now=new Date();let upcoming=state.appointments.filter(a=>{let d=new Date(String(a.appt_date||'')+'T'+String(a.appt_time||'00:00'));return !isNaN(d)&&d>=now}).length;let net=navigator.onLine?'Rede detectada':'Sem rede';s.innerHTML='<strong>Próximos serviços: '+upcoming+' • Pendências: '+n+'</strong><span class="sub">'+net+' • Última sincronização: '+esc(state.lastSync)+'</span>';s.classList.toggle('warn',n>0);updateClock();}
function renderSettings(){$('formArea').innerHTML='<label>Endereço do sincronizador (ex.: http://100.x.x.x:8765)</label><input id="server" placeholder="http://IP:8765" value="'+esc(state.settings.url)+'"><label>Chave de sincronização</label><input id="key" type="password" value="'+esc(state.settings.key)+'"><button id="saveSettings">Salvar configurações</button> <button id="sync">Sincronizar agora</button><p id="status"></p>';$('records').innerHTML='';$('saveSettings').onclick=()=>{state.settings={url:$('server').value.trim().replace(/\/$/,''),key:$('key').value.trim()};save();renderSettings();msg('Configurações de rede salvas permanentemente neste aparelho.')};$('sync').onclick=()=>sync();$('status').innerHTML='Banco local: <b class="ok">Disponível</b><p>Conexão: '+(navigator.onLine?'Rede detectada':'Offline')+'</p><p>Pendências: '+state.queue.length+'</p><p>Última sincronização: '+esc(state.lastSync)+'</p><p>Registros locais: '+(state.appointments.length+state.cash_entries.length+state.service_profits.length)+'</p>'}
async function sync(){let {url,key}=state.settings;if(!url||!key){msg('Configure endereço e chave do servidor.');return}msg('Sincronizando...');try{for(let q of [...state.queue]){let r=await fetch(url+'/api/v3/change',{method:'POST',headers:{'Content-Type':'application/json','X-HelpTech-Key':key},body:JSON.stringify(q)});let j=await r.json();if(!r.ok)throw Error(j.error||'Falha no envio');let rec=state[q.entity].find(x=>x.id===q.localId);if(rec)rec.id=j.record_id;state.queue=state.queue.filter(x=>x.uid!==q.uid);save()}let r=await fetch(url+'/api/v3/snapshot',{headers:{'X-HelpTech-Key':key}});let j=await r.json();if(!r.ok)throw Error(j.error||'Falha na consulta');for(let t of ['appointments','cash_entries','service_profits']){let remote=j[t]||[];let deletes=new Set(state.queue.filter(q=>q.entity===t&&q.operation==='delete').map(q=>String(q.record_id)));let unsent=state[t].filter(a=>state.queue.some(q=>q.entity===t&&q.operation==='create'&&q.localId===a.id));state[t]=remote.filter(a=>!deletes.has(String(a.id))).concat(unsent)}state.lastSync=new Date().toLocaleString('pt-BR');save();updateDashboard();renderSettings();msg('Sincronização concluída.')}catch(e){msg('Sem sincronização: '+e.message+'. Dados locais preservados.')}}
load();updateDashboard();setInterval(()=>{updateClock();if(!$('dashboard').classList.contains('hide'))updateDashboard()},30000);$('goHome').onclick=()=>{$('moduleScreen').classList.add('hide');$('dashboard').classList.remove('hide');updateDashboard()};$('logout').onclick=()=>{$('dashboard').classList.add('hide');$('moduleScreen').classList.add('hide');$('loginWrap').classList.remove('hide');$('password').value=''};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));$('loginTitle').textContent=state.user?'Entrar no aplicativo':'Primeiro acesso — criar usuário e senha';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));window.addEventListener('online',()=>{updateDashboard();if(state.settings.url&&state.settings.key)sync()});window.addEventListener('offline',updateDashboard);
</script></html>
